# Windows x64. Release builds run CPython 3.13 from the python.org installer
# (desktop/packaging-tools.json python_runtime_windows); a native development
# host may use 3.12. pydantic-core and cffi list both the cp312 and the cp313
# win_amd64 digests (cp313 read from PyPI metadata 2026-10-08). PyPI metadata
# and digests read 2026-10-04.
# Exact upstream artifacts, unmodified; hashes are checked before installation.
# Shares backend/requirements-runtime.lock and backend/requirements-render.lock
# with the other platforms so the three packages carry the same application.
# proxy-tools is source-only; install it with --no-build-isolation after the
# build lock (setuptools) is in place, as the macOS lock already does.
-r ../backend/requirements-runtime.lock
-r ../backend/requirements-render.lock

