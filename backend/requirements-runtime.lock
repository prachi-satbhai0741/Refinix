# Coordinator runtime libraries for the standalone Beta, hash-pinned.
#
# Same pattern as backend/requirements-render.lock: every wheel a supported
# profile installs is listed, so one `--require-hashes` install works on macOS
# arm64, Windows x64 and Linux x86_64/aarch64. pip accepts several hashes for
# one requirement and matches the wheel it selected against any of them.
# PyPI metadata and digests read 2026-10-04.
#
# psutil 7.2.2 — BSD-3-Clause. Memory, disk and process facts for hardware
#   presets, owned-process identity for update recovery and socket snapshots
#   for the sampled network observer. No network access of its own.
#   cp36-abi3 macosx_11_0_arm64 / manylinux x86_64 / manylinux aarch64 and
#   cp37-abi3 win_amd64 wheels.
# urllib3 2.8.0 — MIT. HTTP client shared by update-metadata verification and
#   explicit, user-initiated model downloads. Pure Python.
# securesystemslib 1.5.1 — MIT. Pure-Python ed25519 verification by default;
#   the `crypto` extra (signing) belongs to release tooling only.
# tuf 7.0.1 — Apache-2.0 OR MIT. Update metadata/target verification client.
