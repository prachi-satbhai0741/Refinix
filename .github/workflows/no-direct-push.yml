name: No Direct Push

# Detects a commit that landed on `main` or `dev` without going through a pull
# request.
#
# This is a BACKSTOP, not a lock. A workflow runs after the push has already
# been accepted, so it can only raise a loud, permanent failure on the commit.
# Actual prevention comes from the ruleset applied by
# scripts/setup-branch-protection.sh, which requires repository admin.
#
# If this job ever fails, protection is missing or was bypassed. Fix the
# ruleset before continuing.

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  no-direct-push:
    name: no-direct-push
    runs-on: ubuntu-latest
    steps:
      - name: Verify commit arrived via a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # A commit may be associated with several pull requests, and the API
          # also returns OPEN ones for commits outside the default branch. So
          # counting associations is not enough: a commit whose only PR targets
          # a DIFFERENT branch, or is still open, would pass while having been
          # pushed here directly.
          #
          # Require a PR that was actually MERGED INTO THIS BRANCH.
          count="$(gh api "repos/$REPO/commits/$SHA/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq "[.[] | select(.base.ref == \"$BRANCH\" and .merged_at != null)] | length")"

          if [ "$count" -gt 0 ]; then
            echo "OK: $SHA reached '$BRANCH' through a pull request merged into '$BRANCH'."
            exit 0
          fi

          # Show what WAS associated, so a failure is diagnosable.
          echo "Pull requests associated with $SHA (none merged into '$BRANCH'):"
          gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '.[] | "  #\(.number) base=\(.base.ref) state=\(.state) merged_at=\(.merged_at)"' \
            || echo "  (none)"

          echo "::error title=Direct push detected::$ACTOR pushed $SHA directly to '$BRANCH'"
          echo ""
          echo "----------------------------------------------------------"
          echo " DIRECT PUSH TO PROTECTED BRANCH"
          echo "----------------------------------------------------------"
          echo "  branch : $BRANCH"
          echo "  commit : $SHA"
          echo "  actor  : $ACTOR"
          echo ""
          echo "No pull request merged into '$BRANCH' introduced this commit."
          echo ""
          echo "'main' and 'dev' are pull-request only. Every change goes:"
          echo "  <member branch>  ->  dev  ->  main"
          echo ""
          echo "If this fired, the branch ruleset is missing or was bypassed."
          echo "A repository admin must run: scripts/setup-branch-protection.sh"
          exit 1
