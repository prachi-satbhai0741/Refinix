name: Main CI

on:
  pull_request:
    branches:
      - main
      # Only so Dependabot's version updates, which target dev, are checked;
      # the job below skips every other pull request into dev.
      - dev
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    # Pushes to main and every pull request into main, as before. Into dev,
    # only Dependabot's pull requests: member -> dev stays a convention with
    # no automated checks. Dependabot-triggered runs get a read-only token and
    # no repository secrets, and this workflow uses none.
    if: >-
      github.event_name == 'push' ||
      github.base_ref == 'main' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Before anything is installed: a declaration bumped without its
      # hash-pinned locks fails here (standard library only).
      - name: Check declared pins against the shipped locks
        run: python -m unittest discover -s desktop -p 'test_dependency_pins.py' -q

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/worker-image/requirements.lock

      # Without this the coordinator's PDF rendering checks skip instead of
      # running, and the portable reading path would go unverified on the one
      # Linux runner that can prove it works there.
      - name: Install the pinned PDF renderer
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-render.lock

      # psutil for owned-engine identity and hardware facts, and the update
      # verification client. Without it the managed-engine cleanup checks
      # cannot run.
      - name: Install the pinned coordinator runtime libraries
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-runtime.lock

      - name: Install the pinned release tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-release.lock

      - name: Run Python checks
        run: |
          python -m unittest discover -s backend/contracts -t . -p 'test_*.py' -q
          python -m unittest discover -s backend/coordinator -p 'test_*.py' -q
          python -m unittest discover -s backend/worker -p 'test_*.py' -q
          python -m unittest discover -s deploy/k3s -p 'test_*.py' -q
          python -m unittest discover -s fixtures/c07 -p 'test_*.py' -q
          python -m unittest discover -s scripts -p 'test_*.py' -q

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run frontend checks
        run: node --test frontend/app/test-*.cjs
