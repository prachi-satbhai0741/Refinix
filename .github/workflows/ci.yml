name: Main CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/worker-image/requirements.lock

      - name: Run Python checks
        run: |
          python -m unittest discover -s backend/contracts -t . -p 'test_*.py' -q
          python -m unittest discover -s backend/coordinator -p 'test_*.py' -q
          python -m unittest discover -s backend/worker -p 'test_*.py' -q
          python -m unittest discover -s deploy/k3s -p 'test_*.py' -q
          python -m unittest discover -s fixtures/c07 -p 'test_*.py' -q
          python -m unittest discover -s scripts -p 'test_*.py' -q

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run frontend checks
        run: node --test frontend/app/test-*.cjs
